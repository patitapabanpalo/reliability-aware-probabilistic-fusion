[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "reliability-fusion"
version = "0.1.0"
description = "Research code for reliability-aware probabilistic fusion"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "torch", "PyYAML"]
[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest"]

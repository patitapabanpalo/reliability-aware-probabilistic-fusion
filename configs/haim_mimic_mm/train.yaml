# Main HAIM-MIMIC-MM full-model training configuration (ablation F).
# Values are extracted from the current full-model training code.

experiment:
  task: mortality_48h
  seed: 42

model:
  embedding_dim: 128
  latent_dim: 32
  fusion: reliability

training:
  batch_size: 256
  max_epochs: 50
  patience: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 5.0

loss:
  lambda_consistency: 0.10

selection:
  metric: validation_auroc
